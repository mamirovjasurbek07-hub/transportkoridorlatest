databases:
  - name: transit-postgres
    plan: basic-256mb
    databaseName: transit_map
    user: transit_app
    postgresMajorVersion: "16"

services:
  - type: web
    name: transit-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: transit-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INITIAL_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ROUTING_PROVIDER
        value: osrm
      - key: ROUTING_BASE_URL
        value: https://router.project-osrm.org
      - key: ENABLE_DEMO_SEED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: transit-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_MAP_STYLE_URL
        sync: false
      - key: VITE_APP_NAME
        value: Tranzit transport yo'laklari
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
