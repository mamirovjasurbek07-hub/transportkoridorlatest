services:
  - type: web
    name: transportyo-laklari
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INITIAL_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://transportyo-laklari.onrender.com
      - key: FRONTEND_URL
        value: https://transportyo-laklari.onrender.com
      - key: ROUTING_PROVIDER
        value: yandex
      - key: ROUTING_BASE_URL
        value: https://router.project-osrm.org
      - key: ROUTING_PROFILE
        value: driving
      - key: MAP_PROVIDER
        value: yandex
      - key: YANDEX_MAPS_API_KEY
        sync: false
      - key: YANDEX_ROUTER_API_KEY
        sync: false
      - key: YANDEX_ROUTER_BASE_URL
        value: https://api.routing.yandex.net/v2/route
      - key: ROUTING_TIMEOUT_SECONDS
        value: "30"
      - key: ENABLE_DEMO_SEED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
