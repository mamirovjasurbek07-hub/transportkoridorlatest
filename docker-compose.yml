services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: transit_map
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - transit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transit_map"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@database:5432/transit_map
      SECRET_KEY: local-docker-secret-change-in-production-123456789
      ADMIN_INITIAL_EMAIL: admin@example.local
      ADMIN_INITIAL_PASSWORD: CHANGE_ME_NOW
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ROUTING_PROVIDER: osrm
      ROUTING_BASE_URL: https://router.project-osrm.org
      ENABLE_DEMO_SEED: "true"
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  transit_postgres:
  frontend_modules:
